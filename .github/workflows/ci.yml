name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src

      - name: Unit tests
        run: lune run tests/run

      - name: Build places
        run: |
          rojo build places/refuge.project.json -o Fracture-Refuge.rbxl
          rojo build places/eclat.project.json -o Fracture-Eclat.rbxl
